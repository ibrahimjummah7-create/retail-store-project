services:
  #  Web-ui will also act as nginx reverse-proxy
  web-ui:
    build:
      context: ./web-ui/
      dockerfile: Dockerfile
    container_name: web-ui
    ports:
      - "8080:80"
    volumes:
      - ./web-ui/nginx.conf:/etc/nginx/nginx.conf:ro  # This takes precedence
    depends_on:
      products:
        condition: service_healthy
      carts:
        condition: service_healthy
      orders:
        condition: service_healthy
      users:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  products:
    build:
      context: ./services/products
      dockerfile: Dockerfile
    container_name: products
    ports:
      - "8001"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - products_data:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    

  carts:
    build:
      context: ./services/carts
      dockerfile: Dockerfile
    container_name: carts
    ports:
      - "8002"
    depends_on:
      - products
      - redis
    env_file:
      - .env
    networks:
      - web
      - carts-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - carts-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: orders
    ports:
      - "8004"
    depends_on:
      - carts
    env_file:
      - .env
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: users
    ports:
      - "8015"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - web
      - db-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8015/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init/01_users_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db-network
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailuser -d retaildb"] 
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  products_data:

networks:
  web:
    driver: bridge
  carts-cache:   
    driver: bridge
  db-network:
    driver: bridge

